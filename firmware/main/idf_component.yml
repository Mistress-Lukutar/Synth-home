## IDF Component Manager Manifest File
dependencies:
  ## Required IDF version
  idf:
    version: '>=6.0.0'
  # cJSON was moved out of ESP-IDF core in v6.0 and is now a registry component.
  espressif/cjson: '^1.0'
  espressif/mdns: '*'
  # ESP-Zigbee SDK 2.x targets ESP-IDF v6.0.
  espressif/esp-zigbee-lib: '^2.0.0'
  espressif/esp-zboss-lib: '*'
